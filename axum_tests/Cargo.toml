[package]
name = "axum_tests"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { version = "1.52.0", features = ["full"] }
async-trait = "0.1.89"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"

axum = "0.8"
tower-http = { version = "0.6.8", features = ["fs"] }
tower-cookies = "0.11"

lazy-regex = "3"
strum_macros = "0.28.0"
uuid = { version = "1", features = ["v4", "fast-rng"] }
derive_more = { version = "2", features = ["from", "display"] }

[dev-dependencies]
anyhow = "1"
httpc-test = "0.1.1"
